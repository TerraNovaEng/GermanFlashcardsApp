<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Vocabulary Game</title>
    
    <!-- Favicon / Address Bar Icon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 5 3%22><path fill=%22%23000%22 d=%22M0 0h5v1H0z%22/><path fill=%22%23D00%22 d=%22M0 1h5v1H0z%22/><path fill=%22%23FFCE00%22 d=%22M0 2h5v1H0z%22/></svg>">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .stats { margin: 15px; font-weight: bold; }
        .game-container { display: flex; justify-content: center; gap: 50px; margin-top: 20px; }
        .col { display: flex; flex-direction: column; gap: 10px; width: 200px; }
        button { padding: 10px; cursor: pointer; border: 1px solid #999; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>Matching Word Game</h1>
    
    <div class="stats">
        Time: <span id="timer">0</span>s | Attempts: <span id="attempts">0</span> | Correct: <span id="score">0</span>/5
    </div>
    
    <button onclick="resetGame()">Next Round / Restart</button>
    
    <div class="game-container">
        <div id="german-col" class="col"></div>
        <div id="english-col" class="col"></div>
    </div>

    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }

        let vocabData = [];
        let score = 0, attempts = 0, seconds = 0, timerInterval;
        let selected = { german: null, english: null, germanEl: null, englishEl: null };

        fetch('data.json')
            .then(r => r.json())
            .then(data => {
                vocabData = data.vocabulary;
                resetGame();
            });

        function startTimer() {
            clearInterval(timerInterval);
            seconds = 0;
            timerInterval = setInterval(() => { seconds++; document.getElementById('timer').innerText = seconds; }, 1000);
        }

        function resetGame() {
            score = 0; attempts = 0;
            document.getElementById('score').innerText = score;
            document.getElementById('attempts').innerText = attempts;
            startTimer();
            
            const gameSet = vocabData.sort(() => 0.5 - Math.random()).slice(0, 5);
            const germanCol = document.getElementById('german-col');
            const englishCol = document.getElementById('english-col');
            
            germanCol.innerHTML = ''; englishCol.innerHTML = '';

            gameSet.forEach(item => {
                const btn = document.createElement('button');
                btn.innerText = item.german;
                btn.onclick = () => handleSelection('german', item.english, btn);
                germanCol.appendChild(btn);
            });

            [...gameSet].sort(() => 0.5 - Math.random()).forEach(item => {
                const btn = document.createElement('button');
                btn.innerText = item.english;
                btn.onclick = () => handleSelection('english', item.english, btn);
                englishCol.appendChild(btn);
            });
        }

        function handleSelection(type, id, element) {
            if (selected[type + 'El']) selected[type + 'El'].style.backgroundColor = '';
            selected[type] = id; selected[type + 'El'] = element;
            element.style.backgroundColor = 'lightblue';

            if (selected.german && selected.english) {
                attempts++;
                document.getElementById('attempts').innerText = attempts;
                
                if (selected.german === selected.english) {
                    score++;
                    document.getElementById('score').innerText = score;
                    selected.germanEl.style.visibility = 'hidden';
                    selected.englishEl.style.visibility = 'hidden';
                    if (score === 5) { clearInterval(timerInterval); alert(`Done! Time: ${seconds}s, Attempts: ${attempts}`); }
                } else {
                    selected.germanEl.style.backgroundColor = '';
                    selected.englishEl.style.backgroundColor = '';
                }
                selected = { german: null, english: null, germanEl: null, englishEl: null };
            }
        }
    </script>
</body>
</html>
